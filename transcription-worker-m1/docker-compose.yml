version: '3.8'

services:
  transcription-worker:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64  # For M1 Macs
    image: phx-transcription-m1:latest
    container_name: phx-transcription-m1
    platform: linux/arm64

    environment:
      - REDIS_HOST=${REDIS_HOST:-192.168.1.100}
      - REDIS_PORT=${REDIS_PORT:-6380}
      - REDIS_DB=${REDIS_DB:-0}
      - MODEL_CACHE_DIR=/models
      - AUDIO_INPUT_PATH=/data/input
      - TRANSCRIPTION_OUTPUT_PATH=/data/output
      - WORKER_NAME=${WORKER_NAME:-m1-docker-01}
      - PYTHONUNBUFFERED=1

    volumes:
      # Mount local directories
      - ./data/input:/data/input
      - ./data/output:/data/output
      - ./models:/models
      - ./logs:/app/logs

    restart: unless-stopped

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Note: MPS (Metal) is not available in Docker containers
    # The container will use CPU for transcription
    # For GPU acceleration, run natively on macOS instead

  # Optional: Flower monitoring UI
  flower:
    image: mher/flower:latest
    container_name: phx-transcription-flower
    platform: linux/arm64
    environment:
      - CELERY_BROKER_URL=redis://${REDIS_HOST:-192.168.1.100}:${REDIS_PORT:-6380}/0
      - FLOWER_PORT=5556
    ports:
      - "5556:5556"
    restart: unless-stopped
    profiles:
      - monitoring  # Only start with --profile monitoring