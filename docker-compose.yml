services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: phoenix_helicopters
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: "md5"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: postgres -c listen_addresses='*'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:9000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/phoenix_helicopters
      - REDIS_URL=redis://redis:6379
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_production}
      - FR24_API_KEY_SANDBOX=${FR24_API_KEY_SANDBOX}
      - FR24_API_KEY_PRODUCTION=${FR24_API_KEY_PRODUCTION}
      - FR24_API_ENVIRONMENT=${FR24_API_ENVIRONMENT}
      - FR24_MONTHLY_CREDIT_LIMIT=${FR24_MONTHLY_CREDIT_LIMIT}
      - BROADCASTIFY_USERNAME=${BROADCASTIFY_USERNAME}
      - BROADCASTIFY_PASSWORD=${BROADCASTIFY_PASSWORD}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 9000

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/phoenix_helicopters
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_production}
      - FR24_API_KEY_SANDBOX=${FR24_API_KEY_SANDBOX}
      - FR24_API_KEY_PRODUCTION=${FR24_API_KEY_PRODUCTION}
      - FR24_API_ENVIRONMENT=${FR24_API_ENVIRONMENT}
      - FR24_MONTHLY_CREDIT_LIMIT=${FR24_MONTHLY_CREDIT_LIMIT}
      - BROADCASTIFY_USERNAME=${BROADCASTIFY_USERNAME}
      - BROADCASTIFY_PASSWORD=${BROADCASTIFY_PASSWORD}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/phoenix_helicopters
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_production}
      - FR24_API_KEY_SANDBOX=${FR24_API_KEY_SANDBOX}
      - FR24_API_KEY_PRODUCTION=${FR24_API_KEY_PRODUCTION}
      - FR24_API_ENVIRONMENT=${FR24_API_ENVIRONMENT}
      - FR24_MONTHLY_CREDIT_LIMIT=${FR24_MONTHLY_CREDIT_LIMIT}
      - BROADCASTIFY_USERNAME=${BROADCASTIFY_USERNAME}
      - BROADCASTIFY_PASSWORD=${BROADCASTIFY_PASSWORD}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.workers.celery_app beat --loglevel=info

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/phoenix_helicopters
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_production}
      - FLOWER_UNAUTHENTICATED_API=${FLOWER_UNAUTHENTICATED_API:-false}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_started
      celery:
        condition: service_started
      celery-beat:
        condition: service_started
    command: celery -A app.workers.celery_app flower --port=5555 --address=0.0.0.0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://${APP_HOSTNAME:-localhost}:9080
      - REACT_APP_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "9080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
