# Docker Compose override file for production mode
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  frontend:
    build:
      args:
        - NODE_ENV=production
    environment:
      - NODE_ENV=production
      - VITE_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - VITE_MAIN_SEARCH_ADDRESS=${VITE_MAIN_SEARCH_ADDRESS}
    # In production, the built files are served by a static server
    command: serve -s dist -l 3000
    # No need for source code volumes in production
    volumes: []

  backend:
    environment:
      - DEBUG=False
    # No reload in production
    command: uvicorn app.main:app --host 0.0.0.0 --port 9000
    # No source code volumes needed in production
    volumes:
      - ./data:/app/data  # Keep data volume