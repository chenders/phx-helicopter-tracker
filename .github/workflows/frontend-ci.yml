name: Frontend CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - 'scripts/check.sh'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - 'scripts/check.sh'
      - '.github/workflows/frontend-ci.yml'

# One job, ONE `npm ci`, then eslint + tsc (blocking) and vitest (advisory) run in parallel
# inside scripts/check.sh, followed by the production build. Same script developers run locally.
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (once)
        run: cd frontend && npm ci

      - name: Quality gates (parallel)
        # eslint + tsc block the build; vitest + npm-audit are advisory.
        run: bash scripts/check.sh --frontend --tests --audit --jobs 4

      - name: Build production bundle
        run: |
          cd frontend
          npm run build
          ls -lh dist/assets/ 2>/dev/null || ls -lh build/assets/ 2>/dev/null || echo "No build artifacts found"
