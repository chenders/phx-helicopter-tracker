name: Backend CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'backend/**'
      - 'scripts/check.sh'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'backend/**'
      - 'scripts/check.sh'
      - '.github/workflows/backend-ci.yml'

# One job, ONE setup, then all checks run in parallel inside scripts/check.sh
# (blocking: ruff, black, pytest; advisory: mypy, bandit, pip-audit). This is the same
# script developers run locally — single source of truth, no per-check setup tax.
jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci
      ENVIRONMENT: test
      # FR24 in sandbox for tests (never production); a dummy key is enough.
      FR24_API_ENVIRONMENT: sandbox
      FR24_API_KEY_SANDBOX: test-sandbox-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies (once)
        run: |
          cd backend
          pip install --upgrade pip
          # Skip transcription-only whisper packages (they pull torch/CUDA, ~2.5 min).
          # The API/tests/migrations don't transcribe; the worker installs them.
          grep -ivE 'openai-whisper|faster-whisper' requirements.txt > "$RUNNER_TEMP/reqs-ci.txt"
          pip install -r "$RUNNER_TEMP/reqs-ci.txt"
          # Quality tools (versions pinned where CI relied on them).
          pip install black==23.10.1 ruff==0.1.5 mypy bandit pip-audit

      - name: Quality gates (parallel)
        # ruff + black + pytest block the build; mypy + bandit + pip-audit are advisory.
        run: bash scripts/check.sh --backend --tests --audit --jobs 4

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true
