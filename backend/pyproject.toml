[tool.poetry]
name = "phx-helicopters-backend"
version = "0.1.0"
description = "Phoenix Police Helicopter Tracking Backend"
authors = ["Phoenix Helicopters Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.23"
psycopg2-binary = "^2.9.9"
alembic = "^1.12.1"
pydantic = "^2.4.2"
pydantic-settings = "^2.0.3"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
httpx = "^0.25.2"
aiohttp = "^3.9.1"
websockets = "^12.0"
celery = {extras = ["redis"], version = "^5.3.4"}
redis = "^4.6.0"
flower = "^2.0.1"
pandas = "^2.1.3"
numpy = "^1.26.0"
python-dateutil = "^2.8.2"
pytz = "^2023.3"
aiofiles = "^23.2.1"
asyncpg = "^0.29.0"
beautifulsoup4 = "^4.12.2"
# openai-whisper = "20231117"  # Commented out due to triton dependency issues
# If whisper is needed, install it separately with: pip install openai-whisper --no-deps
# and then install its dependencies manually
lxml = "^5.0.0"
brotli = "^1.1.0"
requests = "^2.31.0"
tenacity = "^8.2.3"
flightradarapi = "^1.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
black = "^23.10.1"
ruff = "^0.1.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
