<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Helicopter body -->
  <g transform="translate(16, 16)">
    <!-- Main rotor -->
    <line x1="-12" y1="0" x2="12" y2="0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Fuselage -->
    <ellipse cx="0" cy="2" rx="5" ry="7" fill="currentColor"/>
    
    <!-- Cockpit window -->
    <ellipse cx="0" cy="-1" rx="3" ry="3" fill="rgba(255,255,255,0.3)"/>
    
    <!-- Tail boom -->
    <rect x="-1.5" y="6" width="3" height="8" fill="currentColor"/>
    
    <!-- Tail rotor -->
    <circle cx="0" cy="14" r="0.5" fill="currentColor"/>
    <line x1="-3" y1="14" x2="3" y2="14" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Landing skids -->
    <rect x="-4" y="8" width="1" height="2" fill="currentColor"/>
    <rect x="3" y="8" width="1" height="2" fill="currentColor"/>
    <rect x="-5" y="9" width="10" height="0.5" fill="currentColor"/>
  </g>
</svg>